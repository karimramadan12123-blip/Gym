<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="QR Code Gym">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>QR Code Gym</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- شاشة التحميل -->
  <div id="splash" aria-hidden="true">
    <img src="icons/icon-192.png" alt="" width="96" height="96">
    <h1>QR Code Gym</h1>
  </div>

  <!-- الشاشة الرئيسية -->
  <main id="home" class="screen">
    <button id="settingsBtn" class="icon-btn" aria-label="الإعدادات">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>

    <button id="cardBtn" class="card-btn" aria-label="تكبير الكارت">
      <img id="cardImg" alt="كارت العضوية" draggable="false">
    </button>
  </main>

  <!-- عرض الكارت بحجم كبير -->
  <div id="viewer" class="viewer" hidden>
    <button id="closeViewer" class="icon-btn viewer-close" aria-label="إغلاق">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <div class="viewer-stage">
      <img id="viewerImg" alt="كارت العضوية بحجم كبير" draggable="false">
    </div>
  </div>

  <!-- الإعدادات -->
  <section id="settings" class="screen settings" hidden>
    <header class="settings-header">
      <button id="backBtn" class="icon-btn" aria-label="رجوع">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <h2>الإعدادات</h2>
    </header>

    <div class="settings-body">
      <button id="changeBtn" class="big-btn primary">تغيير الكارت</button>
      <button id="resetBtn" class="big-btn">استعادة الكارت الافتراضي</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </div>

    <input id="fileInput" type="file" accept="image/*" hidden>
  </section>

  <script src="app.js"></script>
</body>
</html>
